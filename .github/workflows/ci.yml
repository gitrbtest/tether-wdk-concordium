name: Package validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - name: Verify unit tests without external networking
        run: sudo unshare --net -- "$(command -v node)" scripts/run-tests.mjs test/unit
      - run: npx --no-install tsc --noEmit types/index.d.ts

  validate-identity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22, 24]
    defaults:
      run:
        working-directory: identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            identity/package-lock.json
      - name: Install the wallet package's dependencies (the identity walkthrough example uses the wallet package)
        run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm test
      - name: Verify unit tests without external networking
        run: sudo unshare --net -- "$(command -v node)" scripts/run-tests.mjs test/unit
      - run: npx --no-install tsc --noEmit types/index.d.ts types/node.d.ts types/verify.d.ts
      - name: Check the WDK entry's types (it imports @tetherto/wdk-wallet's package entries, read in nodenext mode)
        run: npx --no-install tsc --noEmit --strict --target es2022 --lib es2022,dom --module nodenext --moduleResolution nodenext types/wdk.d.ts
